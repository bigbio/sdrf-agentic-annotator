name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NXF_VER: "26.10.3"
  NXF_ANSI_LOG: false

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - name: Check formatting and lint
        run: |
          nextflow lint -format .
          git diff --exit-code
      - name: Check the config
        # -preview does not end with a workflow output block
        # `test,x` parses each container profile (docker, singularity, apptainer) without
        # needing the engine itself, so the new Singularity/Apptainer profiles are validated.
        run: |
          nextflow secrets set LLM_KEY dummy
          nextflow config -profile test,docker . > /dev/null
          nextflow config -profile test,singularity . > /dev/null
          nextflow config -profile test,apptainer . > /dev/null

  unit:
    name: Unit tests
    # Samplesheet parsing and the summary and refine-gate channel logic.
    # No agents run, so no API key is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - uses: nf-core/setup-nf-test@v1
      - name: Run nf-test unit tests
        run: |
          nextflow secrets set LLM_KEY dummy
          nf-test test --tag unit --verbose

  test:
    name: Pipeline test
    # Runs the agents, so it needs a real API key in the repository secret LLM_KEY
    if: github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - uses: nf-core/setup-nf-test@v1
      - name: Run nf-test
        env:
          LLM_KEY: ${{ secrets.LLM_KEY }}
        run: |
          nextflow secrets set LLM_KEY "$LLM_KEY"
          nf-test test --profile=+docker --verbose
