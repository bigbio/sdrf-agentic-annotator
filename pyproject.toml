[project]
name = "sdrf-harness"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["requests"]
[project.optional-dependencies]
dev = ["pytest"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
