# The benchmark roster. Each entry is one "model-arm".
#   provider: claude-cli (Claude Code login, no API key) | anthropic (API key) | ollama | openai
#             | claude-code (skills arm) | custom
#   arm:      raw (standalone draft/validate/repair loop) | skills (Claude Code + sdrf-skills)
#   context_window: the model's maximum context, used to flag context-limited runs
# Output: every raw model gets the same answer budget, max(4096, 2x a correct answer), plus a
# 16k thinking allowance when it reasons. Ollama models run with thinking off unless
# options.think is true (local thinking is slow and otherwise eats the answer budget).
# To add your own model, copy the "your-model" entry, set enabled: true, and point
# options.callable at a function `generate(messages, **options) -> str | (str, usage_dict)`.
models:
  - {id: opus-5-skills,    provider: claude-code, model: claude-opus-5,    arm: skills, context_window: 1000000}
  - {id: sonnet-5-skills,  provider: claude-code, model: claude-sonnet-5,  arm: skills, context_window: 1000000}
  - {id: haiku-4.5-skills, provider: claude-code, model: claude-haiku-4-5, arm: skills, context_window: 200000}
  - {id: opus-5-raw,       provider: claude-cli,  model: claude-opus-5,    arm: raw,    context_window: 1000000}
  - {id: sonnet-5-raw,     provider: claude-cli, model: claude-sonnet-5,  arm: raw,    context_window: 1000000}
  - {id: haiku-4.5-raw,    provider: claude-cli, model: claude-haiku-4-5, arm: raw,    context_window: 200000}
  # Local models (Ollama) are examples for collaborators and are disabled in the workshop benchmark,
  # which is Claude-only (2026-09-18): on an 18 GB laptop they either failed (qwen2.5:3b wrote the
  # wrong format; gemma4 with thinking never finished reasoning in 20k tokens) or took ~1 h per run.
  # Their probe runs are kept in outputs-smoke/. Set enabled: true to include one.
  # gemma4 with thinking was probed on the smallest dataset (2-row SDRF): every turn spent the full
  # 20k-token allowance thinking and never answered (75-80 min per run, 2/2 failed); see
  # outputs-smoke/gemma4-12b-think-probe. The benchmark runs gemma4 without thinking.
  - {id: gemma4-12b-think, provider: ollama, model: "gemma4:12b", arm: raw, context_window: 262144, enabled: false, options: {num_ctx: 65536, think: true}}
  - {id: gemma4-12b-raw,   provider: ollama, model: "gemma4:12b", arm: raw, enabled: false, context_window: 262144, options: {num_ctx: 40960}}
  - {id: qwen3-4b-think,   provider: ollama, model: "qwen3:4b",   arm: raw, enabled: false, context_window: 262144, options: {num_ctx: 65536, think: true}}
  - {id: gemma2-9b-raw,    provider: ollama, model: "gemma2:9b",  arm: raw, enabled: false, context_window: 8192,   options: {num_ctx: 8192}}
  - {id: qwen2.5-3b-raw,   provider: ollama, model: "qwen2.5:3b", arm: raw, enabled: false, context_window: 32768,  options: {num_ctx: 32768}}
  - id: your-model-raw
    provider: custom
    model: your-model-name
    arm: raw
    context_window: 128000
    enabled: false
    options: {callable: "my_provider:generate"}
